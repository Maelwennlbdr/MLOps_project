name: Train Model (Manual)

on:
  workflow_dispatch:
    description: Manually trigger model training and register to MLflow

jobs:
  train:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]"

      - name: DVC pull data
        run: |
          dvc pull -r myremote

      - name: Train model and register to MLflow
        run: |
          python ml/train.py

      - name: Verify model registered
        run: |
          pip install mlflow
          python -c "
          import mlflow
          mlflow.set_tracking_uri('${{ secrets.MLFLOW_TRACKING_URI }}')
          client = mlflow.tracking.MlflowClient()
          model = client.get_registered_model('mlops-model')
          print(f'✅ Model mlops-model registered with {len(model.aliases)} alias(es)')
          for alias_info in model.aliases:
            print(f'   - Alias: {alias_info.alias} → Version {alias_info.version}')
          "
