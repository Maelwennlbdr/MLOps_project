name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install MLflow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow

      - name: Install ML dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Quality Gates
        run: |
          python ml/quality_gates.py

      - name: Build Docker image
        run: docker build -t mlops-prod .

      - name: Run container
        run: |
          docker run -d -p 8000:8000 \
            -e MLFLOW_TRACKING_URI="${{ secrets.MLFLOW_TRACKING_URI }}" \
            -e MLFLOW_TRACKING_USERNAME="${{ secrets.MLFLOW_TRACKING_USERNAME }}" \
            -e MLFLOW_TRACKING_PASSWORD="${{ secrets.MLFLOW_TRACKING_PASSWORD }}" \
            -e MLFLOW_MODEL_URI="models:/mlops-model@Production" \
            --name prod-test \
            mlops-prod

      - name: Show container logs
        run: docker logs prod-test

      - name: Wait for API to be ready
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:8000/health; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 3
          done
          echo "API did not start in time"
          docker logs prod-test
          exit 1

      - name: Test predict endpoint
        run: |
          curl -f -X POST http://localhost:8000/predict \
          -H "Content-Type: application/json" \
          -d '{"Pregnancies":1,"Glucose":85,"BloodPressure":66,"SkinThickness":29,"Insulin":0,"BMI":26.6,"DiabetesPedigreeFunction":0.351,"Age":31}'

      - name: Stop container
        run: docker stop prod-test
