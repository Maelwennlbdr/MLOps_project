name: CI

on:
  pull_request:
    branches:
      - dev

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: unit
            cmd: pytest -v tests/test_unit_schema.py tests/test_dummy.py
          - name: integration
            cmd: pytest -v tests/test_integration_mlflow.py tests/test_integration_api_mlflow.py

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run ${{ matrix.suite.name }} tests
        run: ${{ matrix.suite.cmd }}

  build-docker:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image (no push)
        run: docker build -t mlops-ci .
