name: CI

on:
  pull_request:
    branches:
      - dev

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run unit tests
        run: pytest -v tests/test_unit_schema.py tests/test_dummy.py

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run integration tests
        run: pytest -v tests/test_integration_mlflow.py tests/test_integration_api_mlflow.py

  build-docker:
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image (no push)
        run: docker build -t mlops-ci .
